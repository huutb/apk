<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:#fff;
    padding:15px;
}

h2{
    text-align:center;
    margin:10px 0 18px;
    font-size:24px;
}

#search{
    width:100%;
    padding:12px 15px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
    font-size:16px;
    outline:none;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1f2937;
    margin-bottom:10px;
    padding:15px;
    border-radius:12px;
    transition:.2s;
}

.item:hover{
    background:#293548;
}

.name{
    font-size:18px;
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding-right:10px;
}

.btn{
    background:#22c55e;
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    min-width:65px;
    text-align:center;
}

.btn:hover{
    background:#16a34a;
}

.footer{
    text-align:center;
    color:#9ca3af;
    margin-top:20px;
    font-size:14px;
}
</style>
</head>

<body>

<h2>📦 Kho APK</h2>



<div id="list"></div>

<div class="footer">
Tổng số ứng dụng: <span id="count"></span>
</div>

<script>

const apps=[

["Vanced","https://drive.google.com/uc?export=download&id=1UWIrPr8kYl-Y67Clq_xw3EN0yhRLISaQ"],

["YouTube","LINK_2"],

["Google Maps","LINK_3"],

["APKPure","LINK_4"]

];

function render(keyword=""){

let html="";

let total=0;

apps.forEach(a=>{

if(a[0].toLowerCase().includes(keyword.toLowerCase())){

total++;

html+=`
<div class="item">
<div class="name">${a[0]}</div>
<a class="btn" href="${a[1]}">Tải</a>
</div>
`;

}

});

document.getElementById("list").innerHTML=html;
document.getElementById("count").innerText=total;

}

render();

document.getElementById("search").addEventListener("input",e=>{
render(e.target.value);
});

</script>

</body>
</html>
