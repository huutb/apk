name: Cache Bust

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/apps.js?v=.*/apps.js?v=$HASH\"><\/script>/" index.html
          sed -i "s/script.js?v=.*/script.js?v=$HASH\"><\/script>/" index.html

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Update cache version"
          git push
